name: Release

# Images are built natively on the deploy host (Oracle Ampere, aarch64) and
# pushed to GHCR by scripts/publish-images.sh. Building arm64 on an amd64 runner
# requires QEMU emulation, which repeatedly hung for 10+ minutes.
#
# This workflow therefore only publishes the GitHub release entry and the
# latest.json manifest, and fails fast if the images for the tag are missing.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.1.34
        required: true

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Verify images were published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version='${{ steps.tag.outputs.version }}'
          for image in api web; do
            if ! docker manifest inspect "ghcr.io/$owner/marvelous-docs-$image:$version" > /dev/null 2>&1; then
              echo "::error::ghcr.io/$owner/marvelous-docs-$image:$version is not published yet."
              echo "Build it on the deploy host with: scripts/publish-images.sh $version"
              exit 1
            fi
          done
          echo "Both images present for $version."
      - name: Create release manifest
        run: |
          version='${{ steps.tag.outputs.version }}'
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          jq -n --arg version "$version" --arg owner "$owner" '{version:$version, releaseUrl:("https://github.com/" + $owner + "/marvelous-docs/releases/tag/v" + $version), apiImage:("ghcr.io/" + $owner + "/marvelous-docs-api:" + $version), webImage:("ghcr.io/" + $owner + "/marvelous-docs-web:" + $version)}' > latest.json
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: latest.json
