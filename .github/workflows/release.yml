name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/marvelous-docs
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/server
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-api:latest
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-web:latest
      - name: Create release manifest
        run: |
          version='${{ steps.version.outputs.version }}'
          owner='${{ github.repository_owner }}'
          jq -n --arg version "$version" --arg owner "$owner" '{version:$version, releaseUrl:("https://github.com/" + $owner + "/marvelous-docs/releases/tag/v" + $version), apiImage:("ghcr.io/" + $owner + "/marvelous-docs-api:" + $version), webImage:("ghcr.io/" + $owner + "/marvelous-docs-web:" + $version)}' > latest.json
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: latest.json
