name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute image prefix
        id: image
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/marvelous-docs" >> "$GITHUB_OUTPUT"
      # Single-architecture builds only. Emulating arm64 through QEMU was what
      # made these jobs hang for 10+ minutes; the deploy target is amd64.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          tags: |
            ${{ steps.image.outputs.prefix }}-api:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.prefix }}-api:latest
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=
            VITE_COLLAB_URL=
          push: true
          provenance: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          tags: |
            ${{ steps.image.outputs.prefix }}-web:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.prefix }}-web:latest
      - name: Create release manifest
        run: |
          version='${{ steps.version.outputs.version }}'
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          jq -n --arg version "$version" --arg owner "$owner" '{version:$version, releaseUrl:("https://github.com/" + $owner + "/marvelous-docs/releases/tag/v" + $version), apiImage:("ghcr.io/" + $owner + "/marvelous-docs-api:" + $version), webImage:("ghcr.io/" + $owner + "/marvelous-docs-web:" + $version)}' > latest.json
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: latest.json
