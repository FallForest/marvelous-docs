name: CI

# Only the trigger and the group that cancels superseded runs live here; the
# checks themselves are in ci-checks.yml, which release.yml also calls. A tag
# therefore publishes images only after the same suite a branch run passed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci-checks.yml
