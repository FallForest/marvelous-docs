server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One upload may be 1 GiB (apps/server/src/routes/uploads.ts). nginx's default
    # is 1 MiB, so it answered 413 in under a millisecond for a 60 MiB PDF — the
    # request never reached the API, which is why the message named no limit and
    # the server-side fix looked like it had done nothing.
    #
    # Deliberately ABOVE the API's ceiling. Setting this to exactly 1 GiB means an
    # oversized file is refused here, and nginx's 413 is an HTML page that names no
    # limit — the client shows "上传失败" with no reason. Above it, the request
    # reaches the API, which answers with the JSON error the editor knows how to
    # read. The API is the limit that applies; this is only a backstop against a
    # body so large it should never be streamed at all.
    client_max_body_size 1100m;
    # A gigabyte over a slow link outlives the 60s default between reads, and a
    # proxy_read_timeout cut mid-upload is another failure that looks like the
    # file being too large.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Health probe is served by the API, not the SPA. Without this the
    # catch-all try_files returns index.html for /healthz and external
    # monitors get a misleading 200.
    location = /healthz {
        proxy_pass http://api:3000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream the body straight through. Buffering a 1 GiB upload would write a
        # second copy to /var/cache/nginx first, inside a container with no volume
        # for it.
        proxy_request_buffering off;
    }

    location /collab/ {
        proxy_pass http://api:1234;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
