server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health probe is served by the API, not the SPA. Without this the
    # catch-all try_files returns index.html for /healthz and external
    # monitors get a misleading 200.
    location = /healthz {
        proxy_pass http://api:3000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /collab/ {
        proxy_pass http://api:1234;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
