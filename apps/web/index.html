<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffef9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Marvelous Docs</title>
    <!--
      Paint the stored theme before the bundle loads.

      The React app reads the same key and the same registry (lib/theme.ts), but
      only after the bundle has parsed — a whole first frame in the default
      palette, which on a dark theme is a white flash. This script is the one
      place the id is trusted, so it validates against a literal list instead of
      importing the registry, and it is deliberately tiny and inline: a fetch
      here would reintroduce the delay it exists to remove.
    -->
    <script>
      (function () {
        // id → [color-scheme, page colour]. The only thing here that has to stay
        // in step with THEMES in lib/theme.ts; test/theme.test.ts checks both.
        var themes = { paper: ['light', '#ffffff'], handdrawn: ['light', '#fffef9'] };
        var id = null;
        try { id = localStorage.getItem('mdocs-theme') } catch (error) { id = null }
        if (!Object.prototype.hasOwnProperty.call(themes, id)) id = 'handdrawn';
        var theme = themes[id];
        var root = document.documentElement;
        root.setAttribute('data-theme', id);
        root.style.colorScheme = theme[0];
        // The address bar / title bar frame; applyTheme keeps it in step from here.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme[1]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
